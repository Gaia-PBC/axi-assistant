[pytest]
testpaths = tests
timeout = 180
asyncio_mode = auto
# loadgroup distribution so `@pytest.mark.xdist_group(...)` is honored under the
# default `-n auto` run (tests/unit/test_bridge.py pins itself to one worker for
# parallel-safety). Inert without `-n` (serial runs are unaffected). Ungrouped
# tests still distribute across workers exactly like the default `load` mode.
addopts = --dist loadgroup
markers =
    slow: marks tests as slow (agent spawn/kill cycles)
    flaky: known-flaky/unstable (timing or teardown race). Exclude from must-pass runs with `-m "not flaky"`. TRACKED for a real fix — never a permanent silence.
